<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MBG</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #0a0a0a, #000000);
      color: #fff;
      overflow: hidden;
      transition: 0.5s;
    }

    .container {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    h1 {
      font-size: 4rem;
      letter-spacing: 5px;
      color: #00f7ff;
      text-shadow: 0 0 10px #00f7ff,
                   0 0 20px #00f7ff,
                   0 0 40px #00f7ff;
      animation: flicker 2s infinite alternate;
    }

    @keyframes flicker {
      0% { opacity: 1; }
      45% { opacity: 0.8; }
      50% { opacity: 0.4; }
      55% { opacity: 0.9; }
      100% { opacity: 1; }
    }

    p {
      margin-top: 20px;
      font-size: 1.2rem;
      color: #aaa;
      max-width: 600px;
      text-align: center;
    }

    .btn {
      margin-top: 40px;
      padding: 15px 40px;
      border: 2px solid #00f7ff;
      background: transparent;
      color: #00f7ff;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.3s;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 0;
      bottom: 0;
      left: 0;
      background: #00f7ff;
      transition: 0.3s;
      z-index: -1;
    }

    .btn:hover::before {
      height: 100%;
    }

    .btn:hover {
      color: #000;
      box-shadow: 0 0 20px #00f7ff;
    }

    /* Particle background */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: -2;
    }

  </style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="container">
  <h1>MBG</h1>
  <p>
    Progam makanan bergizi atau yang disebut MBG yang di bagikan kepada seluruh murid di semua sekolah di Indonesia.
  </p>
  <button class="btn" onclick="launch()">PENJELASAN DAN TUJUAN</button>
</div>

<script>
  // Button interaction
  function launch() {
    window.location.href= "penjelasan.html"
  }

  // Particle animation
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let particles = [];

  class Particle {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.radius = Math.random() * 2;
      this.dx = (Math.random() - 0.5) * 1;
      this.dy = (Math.random() - 0.5) * 1;
    }

    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#00f7ff";
      ctx.fill();
    }

    update() {
      this.x += this.dx;
      this.y += this.dy;

      if (this.x < 0 || this.x > canvas.width) this.dx *= -1;
      if (this.y < 0 || this.y > canvas.height) this.dy *= -1;

      this.draw();
    }
  }

  function init() {
    particles = [];
    for (let i = 0; i < 120; i++) {
      particles.push(new Particle());
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => p.update());
    requestAnimationFrame(animate);
  }

  init();
  animate();

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    init();
  });

</script>

</body>
</html>
